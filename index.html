<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obra</title>

  <style>
    body { margin: 0; padding: 4px; font-family: arial; }

    label {
      display: block;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      box-sizing: border-box;
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f7f7f9;      /* aspecto de "só de leitura" */
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #3966fa;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }

    /* Estado de erro / sem resposta: mensagem visível no próprio campo (placeholder) */
    input.has-error { border-color: #d93025; }
    input.has-error::placeholder { color: #d93025; opacity: 1; }

    #estado { margin: 0.4rem 0 0; font-size: 0.85rem; min-height: 1.2em; color: #666; }
    #estado.error { color: #d93025; }
  </style>

  <!-- Biblioteca oficial de Custom Widgets da Jotform (única dependência externa) -->
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>
<body>

  <label for="ultimaResposta">Obra:</label>
  <input type="text" id="ultimaResposta" readonly placeholder="A carregar...">
  <p id="estado" role="status" aria-live="polite"></p>

  <script>
    /* ------------------------------------------------------------------
     * Widget: Última Resposta Jotform
     * Vai buscar a submissão mais recente de OUTRO formulário e mostra
     * o valor de um campo específico. Esse valor é o valor do widget
     * quando o formulário actual é submetido.
     * ------------------------------------------------------------------ */

    // O widget corre num iframe servido pela Vercel, por isso o URL relativo aponta
    // para o mesmo domínio onde está publicado (não precisa de domínio fixo).
    const API_URL = "/api/submissions";
    const FETCH_TIMEOUT_MS = 15000;
    const MSG_SEM_RESPOSTA = "Sem resposta encontrada";

    const input  = document.getElementById("ultimaResposta");
    const estado = document.getElementById("estado");

    /* ----------------------------- UI helpers ----------------------------- */

    function pedirResize() {
      // Ajusta a altura do iframe ao conteúdo (ignora se o método não existir fora da Jotform)
      try { JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 8 }); } catch (_) {}
    }

    /** Mostra uma mensagem no campo (placeholder) e por baixo. O value fica vazio para não gravar texto de erro. */
    function mostrarErro(mensagemCampo, detalhe) {
      input.value = "";
      input.placeholder = mensagemCampo;
      input.classList.add("has-error");
      estado.textContent = detalhe || mensagemCampo;
      estado.classList.add("error");
      pedirResize();
    }

    function mostrarValor(valor, submissao) {
      input.classList.remove("has-error");
      input.value = valor;
      estado.classList.remove("error");
      estado.textContent = submissao.created_at ? `Submissão de ${submissao.created_at}` : "";
      pedirResize();
    }

    /* ------------------------------ Lógica ------------------------------ */

    /** Converte qualquer tipo de resposta Jotform (texto, array, objecto) em texto simples. */
    function paraTexto(v) {
      if (v === null || v === undefined) return "";
      if (Array.isArray(v)) return v.map(paraTexto).filter(Boolean).join(", ");
      if (typeof v === "object") return Object.values(v).map(paraTexto).filter(Boolean).join(" ");
      return String(v).trim();
    }

    /** Valor legível de uma submissão devolvida pelo proxy ("" se não houver resposta válida). */
    function valorDaSubmissao(s) {
      return paraTexto(s.answer) || paraTexto(s.pretty);
    }

    /** Lê e valida as configurações do widget. Devolve { formID, questionID } ou lança Error. */
    function lerConfiguracao() {
      const settings = JFCustomWidget.getWidgetSettings() || {};
      const formID = String(settings.IDform ?? "").trim();
      const questionID = String(settings.IDquestion ?? "").trim();

      if (!formID) throw new Error("Configuração em falta: 'ID do formulário de origem' (IDform).");
      if (!/^\d+$/.test(formID)) throw new Error(`'IDform' inválido: "${formID}" (tem de ser numérico).`);
      if (!questionID) throw new Error("Configuração em falta: 'ID do campo/pergunta a obter' (IDquestion).");
      if (!/^\d+$/.test(questionID)) throw new Error(`'IDquestion' inválido: "${questionID}" (tem de ser numérico).`);

      return { formID, questionID };
    }

    /** Chama o proxy. Lança Error com mensagem legível se algo falhar. */
    async function obterSubmissoes(formID, questionID) {
      const url = `${API_URL}?formID=${encodeURIComponent(formID)}&questionID=${encodeURIComponent(questionID)}&limit=100`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(url, { signal: controller.signal });
        const data = await res.json().catch(() => null);

        if (!res.ok || !data || data.ok === false) {
          throw new Error(data?.error || `Erro ao consultar a API (HTTP ${res.status}).`);
        }
        if (!Array.isArray(data.submissions)) throw new Error("Formato inesperado de dados.");
        return data.submissions;
      } catch (err) {
        if (err.name === "AbortError") throw new Error("A API demorou demasiado a responder.");
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    async function carregarUltimaResposta() {
      try {
        const { formID, questionID } = lerConfiguracao();
        const submissoes = await obterSubmissoes(formID, questionID);

        if (submissoes.length === 0) {
          return mostrarErro(MSG_SEM_RESPOSTA, "O formulário de origem ainda não tem submissões.");
        }

        // Mais recente primeiro (o proxy já ordena; repetimos aqui por segurança)
        submissoes.sort((a, b) =>
          (b.created_at || "").localeCompare(a.created_at || "") ||
          String(b.id).length - String(a.id).length ||
          String(b.id).localeCompare(String(a.id))
        );

        // Percorre da mais recente para a mais antiga até encontrar uma resposta válida
        for (const s of submissoes) {
          const valor = valorDaSubmissao(s);
          if (valor) return mostrarValor(valor, s);
        }

        mostrarErro(
          MSG_SEM_RESPOSTA,
          `Nenhuma das ${submissoes.length} submissões analisadas tem resposta no campo ${questionID}.`
        );
      } catch (err) {
        console.error("Última Resposta Jotform:", err);
        mostrarErro("Erro ao obter a resposta", err.message);
      }
    }

    /* --------------------------- Jotform events --------------------------- */

    if (typeof JFCustomWidget === "undefined") {
      // Aberto fora da Jotform (ou biblioteca bloqueada)
      mostrarErro("Widget fora da Jotform", "A biblioteca JFCustomWidget não foi carregada. Este widget só funciona dentro de um formulário Jotform.");
    } else {
      JFCustomWidget.subscribe("ready", async function () {
        await carregarUltimaResposta();
        JFCustomWidget.setReady(); // chama sempre, mesmo com erro, para não bloquear o formulário
      });

      // Na submissão grava exactamente o que está visível no campo de texto
      JFCustomWidget.subscribe("submit", function () {
        JFCustomWidget.sendSubmit({
          valid: true,
          value: document.getElementById("ultimaResposta").value
        });
      });
    }
  </script>
</body>
</html>
