<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valor Externo Jotform</title>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; font-family: Arial, sans-serif; }
    .wrapper { padding: 4px; width: 100%; }
    input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #b8bdc9;
      border-radius: 4px;
      background: #f7f8fa;
      color: #2c3345;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #2e69ff; }
    .status { margin-top: 5px; font-size: 12px; color: #6b7280; display: none; }
    .status.error { display: block; color: #b42318; }
  </style>
</head>
<body>
  <div class="wrapper">
    <input id="externalValue" type="text" readonly aria-label="Valor externo" />
    <div id="status" class="status"></div>
  </div>

  <script>
    const input = document.getElementById("externalValue");
    const status = document.getElementById("status");
    let widgetValue = "";

    function clean(value) {
      return String(value ?? "").trim();
    }

    function isNumericId(value) {
      return /^\d+$/.test(value);
    }

    function showError(message) {
      status.textContent = message;
      status.className = "status error";
    }

    function clearError() {
      status.textContent = "";
      status.className = "status";
    }

    function publishValue(value) {
      widgetValue = clean(value);
      input.value = widgetValue;
      JFCustomWidget.sendData({
        valid: true,
        value: widgetValue
      });
    }

    JFCustomWidget.subscribe("ready", async function () {
      const settings = JFCustomWidget.getWidgetSettings() || {};

      const formID = clean(settings.IDform);
      const fieldID = clean(settings.IDquestion);
      const submissionID = clean(settings.SubmissionID);
      const placeholder = clean(settings.Placeholder) || "Sem valor";

      input.placeholder = placeholder;

      if (!isNumericId(formID)) {
        showError("Configuração inválida: ID do formulário de origem.");
        publishValue("");
        JFCustomWidget.setReady();
        return;
      }

      if (!isNumericId(fieldID)) {
        showError("Configuração inválida: ID do campo de origem.");
        publishValue("");
        JFCustomWidget.setReady();
        return;
      }

      if (submissionID && !isNumericId(submissionID)) {
        showError("Configuração inválida: Submission ID.");
        publishValue("");
        JFCustomWidget.setReady();
        return;
      }

      try {
        const params = new URLSearchParams({ formID, fieldID });
        if (submissionID) params.set("submissionID", submissionID);

        const response = await fetch(`/api/value?${params.toString()}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Não foi possível obter o valor.");
        }

        clearError();
        publishValue(data.value ?? "");
      } catch (error) {
        console.error("Erro ao carregar valor externo:", error);
        showError(error.message || "Erro ao carregar o valor externo.");
        publishValue("");
      } finally {
        JFCustomWidget.requestFrameResize({ height: 56 });
        JFCustomWidget.setReady();
      }
    });

    JFCustomWidget.subscribe("submit", function () {
      JFCustomWidget.sendSubmit({
        valid: true,
        value: widgetValue
      });
    });
  </script>
</body>
</html>
